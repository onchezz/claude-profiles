[package]
name = "claude-profiles"
version = "0.2.0"
edition = "2021"
description = "Run multiple Claude Desktop and Claude Code accounts side by side on macOS, fully isolated."
license = "MIT"
# Where `claude-profiles upgrade` installs from when no --git/--path is
# given. Leave empty until this crate has a home; upgrade then asks for one.
repository = "https://github.com/onchezz/claude-profiles"
rust-version = "1.75"

[[bin]]
name = "claude-profiles"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
console = "0.15"
dialoguer = { version = "0.11", default-features = false }
libc = "0.2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps settings.json and friends in the order their owner
# wrote them, the way the original's JSON.parse/stringify round-trip does.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
